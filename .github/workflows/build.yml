name: Build PS2 PAD LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PS2 ELF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/ps2dev/ps2sdk:latest \
            make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2-PAD-LAB
          path: PS2_PAD_LAB.elf
