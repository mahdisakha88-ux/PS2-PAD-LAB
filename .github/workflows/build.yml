
name: Build PS2 PAD LAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2-PAD-LAB
          path: PS2_PAD_LAB.elf

